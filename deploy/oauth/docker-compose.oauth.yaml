# Cloud-hub overlay: puts oauth2-proxy + nginx in front of the bridge so it
# never has to be reachable without an authenticated identity (ADR-0003:
# docs/adr/0003-delegated-auth-with-loopback-default.md). Layers on top of
# the base compose file produced by the Docker packaging work, it does not
# replace it.
#
# Usage:
#   docker compose -f docker-compose.yaml -f deploy/oauth/docker-compose.oauth.yaml up -d
#
# Requires a root docker-compose.yaml that defines a `bridge` service built
# from the repo Dockerfile (port 5173, healthcheck against /api/hosts). This
# file overrides that service so it is internal-only, and adds oauth2-proxy
# and nginx as the public edge.
#
# Note: Compose resolves every relative path in this file (env_file,
# volumes) against the *project directory* — the directory of the first -f
# file, i.e. the repo root when invoked as above — not against this file's
# own deploy/oauth/ location. That's why the volume mounts below are
# written as ./deploy/oauth/... instead of ./....

services:
  bridge:
    # Base service exposes 5173 to the host for laptop-only use; the
    # cloud-hub topology must not repeat that — only nginx faces the
    # internet. `!reset` (Compose Spec merge extension, Compose v2.24+)
    # clears the base `ports:` list instead of appending to it.
    ports: !reset []
    # Non-default bind is intentional here: nginx + oauth2-proxy are the
    # actual gate per ADR-0003, and 0.0.0.0 is only reachable from other
    # containers on the internal network below, never from the host network.
    command: ['--bind', '0.0.0.0', '--i-know-what-im-doing']
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'curl', '-sSf', 'http://127.0.0.1:5173/api/hosts']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    # Real secrets (client id/secret, cookie secret) come from the
    # operator's own secrets manager via this env file — never committed.
    # See deploy/oauth/README.md for the required variable names.
    #
    # Compose resolves relative env_file paths against the *project
    # directory* (the directory of the first -f file, i.e. the repo root
    # when invoked per docs/how-to/oauth-proxy.md), not against this
    # overlay file's own directory — so this is repo-root .env, not
    # deploy/oauth/.env.
    env_file:
      - .env
    volumes:
      - ./deploy/oauth/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    command: ['--config=/etc/oauth2-proxy/oauth2-proxy.cfg']
    networks:
      - internal
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4180/ping']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/oauth/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt cert material. Point this at wherever certbot renews
      # to on the host; paths inside nginx.conf reference the domain dir
      # under here.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - internal
    depends_on:
      oauth2-proxy:
        condition: service_healthy

networks:
  internal:
    driver: bridge
