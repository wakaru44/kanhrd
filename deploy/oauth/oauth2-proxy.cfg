# oauth2-proxy config for the kanhrd cloud-hub topology (ADR-0003:
# docs/adr/0003-delegated-auth-with-loopback-default.md). oauth2-proxy is
# the identity gate; the bridge itself owns no credentials.
#
# provider = "github" is used here as the concrete example. Swap in one of
# these instead if you use a different SSO provider (same overall shape,
# different provider-specific access-restriction keys):
#
#   provider              | restrict access with
#   -----------------------|--------------------------------------------
#   github                 | github_org / github_team / github_users
#   google                 | google_group_type + google_admin_email
#                           | (service account, see oauth2-proxy docs)
#   gitlab                 | gitlab_group / gitlab_projects
#   oidc (e.g. Authentik)  | oidc_issuer_url + your IdP's group claim
#
# Full reference: https://oauth2-proxy.github.io/oauth2-proxy/configuration/providers/

http_address = "0.0.0.0:4180"
provider = "github"

# Restrict who can sign in. Prefer an org/team allowlist over listing
# individual users so access follows your GitHub org membership.
github_users = ["<REPLACE_ME_GITHUB_USERNAME>"]
# github_org  = "<REPLACE_ME_GITHUB_ORG>"
# github_team = "<REPLACE_ME_GITHUB_ORG>/<REPLACE_ME_GITHUB_TEAM>"

email_domains = ["<REPLACE_ME_EMAIL_DOMAIN_OR_STAR>"]

upstreams = ["http://bridge:5173"]

# Emit the authenticated identity as a response header on the auth_request
# subrequest, and let it pass through to the upstream too. nginx.conf reads
# X-Auth-Request-User off the auth_request response and forwards it to the
# bridge as X-Forwarded-User — the trusted identity header ADR-0003
# specifies.
pass_user_headers = true
set_xauthrequest = true

cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"

reverse_proxy = true
skip_provider_button = true

# --- secrets: do NOT put real values in this file ---------------------
# client_id, client_secret, and cookie_secret are supplied at runtime via
# environment variables in the repo-root .env file referenced by
# deploy/oauth/docker-compose.oauth.yaml's `env_file:`, so they never land
# in git history:
#
#   OAUTH2_PROXY_CLIENT_ID=<REPLACE_ME_GITHUB_OAUTH_APP_CLIENT_ID>
#   OAUTH2_PROXY_CLIENT_SECRET=<REPLACE_ME_GITHUB_OAUTH_APP_CLIENT_SECRET>
#   OAUTH2_PROXY_COOKIE_SECRET=<REPLACE_ME_32_BYTES_BASE64>
#
# Generate the cookie secret with:
#   openssl rand -base64 32 | tr -- '+/' '-_'
