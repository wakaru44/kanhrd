# Public edge for the kanhrd cloud-hub topology (ADR-0003). Terminates TLS,
# gates every request through oauth2-proxy via auth_request, then forwards
# authenticated requests to the bridge with the trusted identity header.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf by
# deploy/oauth/docker-compose.oauth.yaml. Replace <REPLACE_ME_DOMAIN> with
# your real domain and point the TLS volume mount at your certbot output.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name <REPLACE_ME_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <REPLACE_ME_DOMAIN>;

    # Let's Encrypt / certbot output, bind-mounted from the host — see
    # docker-compose.oauth.yaml's /etc/letsencrypt volume.
    ssl_certificate     /etc/letsencrypt/live/<REPLACE_ME_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<REPLACE_ME_DOMAIN>/privkey.pem;

    # oauth2-proxy's own endpoints (sign-in, callback, sign-out). Must stay
    # reachable directly, without going through auth_request first, or
    # nothing can ever complete the login flow.
    location /oauth2/ {
        proxy_pass       http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal subrequest target for auth_request below — not reachable
    # directly from the outside (`internal;`).
    location = /oauth2/auth {
        internal;
        proxy_pass       http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # Everything else, including /ws, goes through the auth gate and then
    # to the bridge.
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        # oauth2-proxy returns the authenticated identity on the
        # X-Auth-Request-User response header when set_xauthrequest=true
        # (see oauth2-proxy.cfg). Forward it as X-Forwarded-User, the
        # trusted identity header ADR-0003 specifies the bridge trusts.
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        proxy_set_header X-Forwarded-User $auth_user;

        proxy_pass       http://bridge:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — required for the /ws terminal stream. Applies
        # to this whole location block, so it also covers /ws specifically.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
