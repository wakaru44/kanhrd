# Base compose file. It carries no herdr mount on purpose — the mount form
# is platform-dependent (see docker-compose.linux.yaml and
# docker-compose.macos.yaml) — so this file is never used alone. Use
# `make docker-up`, which picks the overlay from $PLATFORM, or spell it out:
#   docker compose -f docker-compose.yaml -f docker-compose.macos.yaml up -d
services:
  bridge:
    build: .
    image: kanhrd-bridge
    ports:
      # Loopback-only, per ADR-0003. Change to 0.0.0.0:5173:5173 only if you
      # understand the exposure and pass --i-know-what-im-doing to the bridge.
      # Changing the host-side port also changes the origin the browser
      # sends, so the image's `--allowed-origin` values (see Dockerfile CMD)
      # must change with it or every handshake is refused with 403.
      - '127.0.0.1:5173:5173'
    # Mount targets in the overlays sit under /home/kanhrd, the image's
    # non-root user's home, which is also where the bridge's default socket
    # path resolves. Running with a different `--user` (e.g. -u 1000:1000,
    # no matching passwd entry) makes Node's homedir() resolve to `/`, so the
    # bridge looks for /.config/herdr/herdr.sock and finds neither socket nor
    # herdr's config.
    restart: unless-stopped
    # Guard against a bare `docker compose up`, which would otherwise start a
    # bridge with no herdr mount at all and fail the way this whole setup is
    # built to avoid: container healthy, host offline forever, nothing in the
    # logs but a connect error. The overlays redefine this volume as an
    # ordinary local one; on its own the base file declares it external and
    # missing, so compose refuses to start.
    volumes:
      - platform-overlay:/var/lib/kanhrd/platform-overlay:ro

  # Multi-host / remote setup (ADR-0001): reach a non-local herdr through an
  # SSH tunnel that lands a socket on this machine, then mount that socket
  # plus a kanhrd.config.yaml (bridge has no env-based socket override; the
  # config file's `hosts:` list is the supported way to add hosts) that adds
  # it as an extra host entry. Bring up the tunnel yourself first, e.g.:
  #   ssh -N -L /run/user/1000/herdr-cloud.sock:~/.config/herdr/herdr.sock cloud-host
  # The tunnel socket takes the same mount form as the local one on this
  # platform — socket file on Docker Desktop, parent directory on Linux.
  # bridge-cloud:
  #   build: .
  #   image: kanhrd-bridge
  #   # `command:` replaces the image's CMD wholesale, so the bind flag and
  #   # the origin allowlist have to be restated here. Published on 5174, so
  #   # the browser's origin is http://127.0.0.1:5174 — name that origin or
  #   # the /ws handshake is refused with 403, with the reason only in the
  #   # container log.
  #   command: ["--config", "/home/kanhrd/kanhrd.config.yaml",
  #             "--bind", "0.0.0.0", "--i-know-what-im-doing",
  #             "--allowed-origin", "http://127.0.0.1:5174",
  #             "--allowed-origin", "http://localhost:5174"]
  #   ports:
  #     - "127.0.0.1:5174:5173"
  #   volumes:
  #     - ./kanhrd.config.yaml:/home/kanhrd/kanhrd.config.yaml:ro
  #     - /run/user/1000:/home/kanhrd/tunnel:ro          # Linux
  #     - /run/user/1000/herdr-cloud.sock:/home/kanhrd/.config/herdr/herdr-cloud.sock:ro  # Docker Desktop
  #   restart: unless-stopped

volumes:
  # Deliberately external and non-existent: see the guard comment above.
  platform-overlay:
    external: true
    name: kanhrd-no-platform-overlay-selected-use-make-docker-up
