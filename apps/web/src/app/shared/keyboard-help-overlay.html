@if (open()) {
  <div class="modal-backdrop" (click)="onBackdropClick()">
    <div
      #dialog
      class="modal"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-label]="copy.nav.help"
      (click)="$event.stopPropagation()"
      (keydown.escape)="close()"
    >
      <div class="modal-header">
        <h2 class="modal-title">{{ copy.nav.help }}</h2>
        <button
          type="button"
          class="close-btn"
          [title]="copy.help.close"
          [attr.aria-label]="copy.help.close"
          (click)="close()"
        >
          <svg lucideX class="icon"></svg>
        </button>
      </div>
      <p class="prefix-note"><kbd>{{ keyboard.prefix() }}</kbd> {{ copy.help.prefixNote }}</p>

      @for (group of groups(); track group.category) {
        <section class="shortcut-group">
          <h3>{{ categoryLabel(group.category) }}</h3>
          <dl>
            @for (binding of group.bindings; track binding.action) {
              <div class="shortcut-row">
                <dt><kbd>{{ keysLabel(binding) }}</kbd></dt>
                <dd>{{ binding.description }}</dd>
              </div>
            }
          </dl>
        </section>
      }
    </div>
  </div>
}
