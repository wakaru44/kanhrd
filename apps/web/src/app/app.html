<header class="app-header">
  <button
    type="button"
    class="icon-btn hamburger"
    [title]="copy.nav.toggleNav"
    [attr.aria-label]="copy.nav.toggleNav"
    (click)="toggleRail()"
  >
    <svg lucideMenu class="icon"></svg>
  </button>
  <a routerLink="/" class="brand">ka<span class="crook-letter">n</span>hrd</a>
  <span class="header-spacer"></span>
  <app-theme-panel />
  <a
    routerLink="/settings"
    class="icon-btn"
    [title]="copy.nav.settings"
    [attr.aria-label]="copy.nav.settings"
  >
    <svg lucideSettings class="icon"></svg>
  </a>
</header>
<main>
  <router-outlet />
</main>

<app-keyboard-help-overlay [open]="keyboard.helpOpen()" (closed)="keyboard.closeHelp()" />
<app-toast-host />
