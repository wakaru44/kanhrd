<header class="app-header">
  <button
    type="button"
    class="icon-btn hamburger"
    title="Toggle navigation"
    aria-label="Toggle navigation"
    (click)="toggleRail()"
  ><svg lucideMenu class="icon"></svg></button>
  <a routerLink="/" class="brand">kanhrd</a>
  <span class="header-spacer"></span>
  <button
    type="button"
    class="icon-btn theme-toggle"
    [attr.data-theme-target]="themeService.theme() === 'dark' ? 'light' : 'dark'"
    [title]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="toggleTheme()"
  >
    @if (themeService.theme() === 'dark') {
      <svg lucideSun class="icon"></svg>
    } @else {
      <svg lucideMoon class="icon"></svg>
    }
  </button>
  <a routerLink="/settings" class="icon-btn" title="Settings" aria-label="Settings">
    <svg lucideSettings class="icon"></svg>
  </a>
</header>
<main>
  <router-outlet />
</main>

<app-keyboard-help-overlay [open]="keyboard.helpOpen()" (closed)="keyboard.closeHelp()" />
<app-toast-host />
