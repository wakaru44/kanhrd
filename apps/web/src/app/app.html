<header class="app-header">
  <button
    type="button"
    class="icon-btn hamburger"
    [title]="copy.nav.toggleNav"
    [attr.aria-label]="copy.nav.toggleNav"
    (click)="toggleRail()"
  ><svg lucideMenu class="icon"></svg></button>
  <a routerLink="/" class="brand">ka<span class="crook-letter">n</span>hrd</a>
  <span class="header-spacer"></span>
  <button
    type="button"
    class="icon-btn theme-toggle"
    [attr.data-theme-target]="themeService.theme() === 'dark' ? 'light' : 'dark'"
    [title]="themeLabel()"
    [attr.aria-label]="themeLabel()"
    (click)="toggleTheme()"
  >
    @if (themeService.theme() === 'dark') {
      <svg lucideSun class="icon"></svg>
    } @else {
      <svg lucideMoon class="icon"></svg>
    }
  </button>
  <a routerLink="/settings" class="icon-btn" [title]="copy.nav.settings" [attr.aria-label]="copy.nav.settings">
    <svg lucideSettings class="icon"></svg>
  </a>
</header>
<main>
  <router-outlet />
</main>

<app-keyboard-help-overlay [open]="keyboard.helpOpen()" (closed)="keyboard.closeHelp()" />
<app-toast-host />
