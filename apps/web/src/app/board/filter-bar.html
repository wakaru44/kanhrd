<div class="filter-bar">
  <div class="chip-row">
    @for (host of store.hostsSignal(); track host.name) {
      <button
        type="button"
        class="chip host-chip"
        [class.excluded]="isHostExcluded(host.name)"
        [attr.aria-pressed]="!isHostExcluded(host.name)"
        (click)="toggleHost(host.name)"
      >
        <span
          class="conn-dot"
          [class.ok]="host.connected"
          [class.err]="!host.connected"
          [attr.title]="host.connected ? 'connected' : (host.last_error ?? copy.state.unavailable)"
        ></span>
        <span class="chip-label">{{ host.name }}</span>
      </button>
    }
  </div>

  <div class="chip-row">
    @for (status of statusOrder; track status) {
      <button
        type="button"
        class="chip status-chip"
        [attr.data-status]="status"
        [class.excluded]="isStatusHidden(status)"
        [attr.aria-pressed]="!isStatusHidden(status)"
        (click)="toggleStatus(status)"
      >
        <span class="status-dot"></span>
        <span class="chip-label">{{ statusLabel(status) }}</span>
        <span class="chip-count" aria-hidden="true">{{ statusCount(status) }}</span>
      </button>
    }
  </div>

  <!--
    Group by. A visible third chip row beside the host and status rows —
    never an overflow menu and never hover-only: the operator changes the
    board's arrangement while reading the board (docs/UX-GUIDELINES.md,
    "Visible affordances"). Exclusive, so the chosen chip is marked
    selected rather than the others being struck through.
  -->
  <div class="chip-row group-row" role="group" [attr.aria-label]="copy.swimlane.groupBy">
    <span class="row-label">{{ copy.swimlane.groupBy }}</span>
    @for (dimension of dimensions; track dimension) {
      <button
        type="button"
        class="chip group-chip"
        [class.selected]="isGroupedBy(dimension)"
        [attr.aria-pressed]="isGroupedBy(dimension)"
        (click)="groupBy(dimension)"
      >
        <span class="chip-label">{{ dimensionLabel(dimension) }}</span>
      </button>
    }
  </div>
</div>
