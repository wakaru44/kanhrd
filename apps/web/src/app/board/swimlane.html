<!--
  The band's own column-reorder drop list, on the band rather than on the
  strip: the strip carries the `cdkDropListGroup` that connects its card
  lists, and one element cannot host both without making the group's
  resolution depend on directive order. `cdkDropListElementContainer` names
  the strip as where the items are. A reorder here reorders the whole board —
  there is one `order`, and every band renders it.
-->
<section
  class="swimlane"
  [attr.aria-label]="title() ?? label()"
  [attr.data-lane]="lane().key"
  cdkDropList
  cdkDropListOrientation="horizontal"
  cdkDropListElementContainer=".swimlane-strip"
  [cdkDropListDisabled]="!reorderEnabled()"
  [cdkDropListSortPredicate]="columnSortPredicate"
  (cdkDropListDropped)="onColumnDropped($event)"
>
  <header class="swimlane-header">
    <h2 class="swimlane-title" [attr.title]="title()">{{ label() }}</h2>
    <span class="swimlane-count">{{ count() }}</span>
  </header>
  <!-- Each band connects its OWN columns: a drag inside a band works, and a
       card never jumps between bands, which would mean changing the fact the
       band groups by. -->
  <div class="swimlane-strip" cdkDropListGroup #strip (scroll)="onStripScroll()">
    @for (column of columns(); track column.key) {
      <!-- No tabpanel role here: with bands there are many columns per
           status, so a single switcher tab cannot control one panel. The
           switcher drops its `aria-controls` while grouping is on.

           A parked column is board furniture, not a property of the cards
           in a band, so every band renders the whole column set — parked
           columns included, empty ones kept. -->
      <app-column
        cdkDrag
        [cdkDragData]="column"
        [cdkDragDisabled]="column.parked === null || !reorderEnabled()"
        [status]="column.status"
        [parked]="column.parked"
        [panes]="panesFor(column)"
        [capabilities]="capabilities()"
      />
    }
  </div>
</section>
