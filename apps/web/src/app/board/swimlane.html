<section class="swimlane" [attr.aria-label]="title() ?? label()" [attr.data-lane]="lane().key">
  <header class="swimlane-header">
    <h2 class="swimlane-title" [attr.title]="title()">{{ label() }}</h2>
    <span class="swimlane-count">{{ count() }}</span>
  </header>
  <div class="swimlane-strip" #strip (scroll)="onStripScroll()">
    @for (status of statuses(); track status) {
      <!-- No tabpanel role here: with bands there are many columns per
           status, so a single switcher tab cannot control one panel. The
           switcher drops its `aria-controls` while grouping is on. -->
      <app-column [status]="status" [panes]="panesFor(status)" [capabilities]="capabilities()" />
    }
  </div>
</section>
