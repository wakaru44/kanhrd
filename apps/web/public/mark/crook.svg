     role="img" aria-label="kanhrd" color="#c8842a">
  <title>kanhrd crook</title>
  <!-- The brand mark: a shepherd's crook drawn as one modulated brushstroke.
       A filled outline, not a stroked line, so the width can taper - thin at
       the hook tip, heaviest at the top shoulder of the curl, tapering again
       down the staff to a fine tail.
       Fill is currentColor, so an inlined copy picks up the theme ochre token.
       The root `color` presentation attribute keeps it ochre when the file is
       used standalone or as an image src; any CSS rule overrides it. -->
