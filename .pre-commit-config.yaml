# pre-commit configuration for kanhrd.
#
# Scope note: `apps/**` and `packages/**` were excluded while the lint lane
# ran concurrently with the tier lanes, so the gate could not conflict with
# in-flight work. That work landed; the fence outlived it and left the whole
# SPA and bridge unlinted (prettier had never run on a single source file).
# They are IN scope now.
#
# Still out of scope, deliberately:
#   openspec/**      - `openspec validate --strict` is its own, stronger gate
#   docs/adr/**      - decision records are frozen once accepted
#   docs/history/**  - frozen historical artifacts, captured verbatim
#   .claude/         - prompt structure, not prose
#   pnpm-lock.yaml   - generated
# `tmp/` is gitignored in its entirety, so it never reaches a hook.
exclude: >
  (?x)^(
    openspec/|
    docs/adr/|
    README\.md|
    pnpm-lock\.yaml|
    \.claude/|
    docs/history/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # docker-compose files legitimately use Compose Spec YAML tags
        # (e.g. `!reset`) that PyYAML rejects without --unsafe.
        args: [--unsafe]
        exclude: ^\.forgejo/workflows/
      - id: check-json
        # Angular's tsconfigs are JSONC — comments are load-bearing there
        # (they document why each compiler flag is set) and `check-json`
        # is a strict JSON parser. TypeScript itself validates them.
        exclude: (?x)^(apps/web/tsconfig.*\.json)$
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          - -d
          - >-
            {extends: default,
             rules: {line-length: {max: 120},
                     document-start: disable,
                     comments-indentation: disable}}
        # Forgejo/GitHub Actions workflow files use `on:` (truthy) intentionally
        # and often contain long single-line `run:` commands. Not worth
        # re-flowing for lint's sake.
        exclude: ^\.forgejo/workflows/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, ts, jsx, tsx, css, scss, markdown, yaml, json]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.13.6
    hooks:
      - id: markdown-link-check
        args: [--quiet]
        stages: [pre-push]

  # apps/web has no ESLint config or `lint` script yet (Angular's own
  # `angular.json` only defines build/serve/extract-i18n/test targets, see
  # docs/CONTRIBUTING.md). This hook is a placeholder that becomes a real
  # check the day that script exists; `--if-present` makes it a no-op until
  # then instead of failing every commit.
  # Design-token gate for apps/web SCSS: no raw hex outside
  # `shared/tokens.scss`, no raw `rem` outside `shared/typography.scss`
  # (docs/DESIGN-SYSTEM.md, "Lint gate"). Scans the tree itself rather than
  # taking filenames, so it also covers a commit that touches no SCSS; the
  # not-yet-migrated component styles are ratcheted inside the script.
  - repo: local
    hooks:
      - id: scss-design-tokens
        name: scss design tokens (no raw hex / rem)
        entry: bash tools/lint-scss-tokens.sh
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: web-lint
        name: web lint (apps/web, if configured)
        entry: pnpm --filter @kanhrd/web run --if-present lint
        language: system
        files: ^apps/web/.*\.[jt]sx?$
        pass_filenames: false
